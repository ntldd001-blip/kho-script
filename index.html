<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho Script</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#2b2f36;--soft:#dfe3e8;--ac:#2f6fed;--ac2:#fff;--ok:#1a9a55;--dn:#d33;--code:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mut:#98a1ad;--bd:#aab2bd;--soft:#32373f;--ac:#5b92ff;--ac2:#0b0d10;--ok:#3ec97d;--dn:#ff6b6b;--code:#15171b;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
textarea,input{font:inherit;color:var(--tx);background:var(--code);border:1px solid var(--soft);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:var(--ac2);font-weight:600;white-space:nowrap}
button.ghost{background:transparent;color:var(--dn);border:1px solid var(--soft);padding:8px 10px}
button.ok{background:var(--ok);color:#fff}
.search{position:relative;margin-bottom:6px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:16px}
.search input{font-size:16px;padding:12px 44px 12px 42px;border-radius:12px;border:2px solid var(--bd);background:var(--card)}
.search .qc{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:4px 9px;background:var(--soft);color:var(--tx);display:none}
.found{font-size:12px;color:var(--mut);min-height:18px;margin:0 4px 8px}
#tools{margin-bottom:14px}
.add{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.add input{width:190px}
.add textarea{flex:1;min-width:200px;min-height:44px;height:44px}
.exp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.table{border:2px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--card)}
.head,.row{display:grid;grid-template-columns:190px 1fr 1fr}
.head{border-bottom:2px solid var(--bd);font-weight:700;text-align:center}
.head div{padding:10px}
.head div:not(:last-child),.cell:not(:last-child){border-right:2px solid var(--bd)}
.row+.row{border-top:1px solid var(--soft)}
.cell{display:flex;gap:8px;align-items:flex-start;padding:10px;min-width:0}
.cell textarea{flex:1;min-width:0;height:62px;min-height:44px}
.gname{font-weight:600;word-break:break-word;width:100%;line-height:1.35;padding:6px 2px}
.cell textarea.gin{height:auto;min-height:38px;font-family:inherit;font-size:15px;font-weight:600;line-height:1.35;resize:none;overflow:hidden;word-break:break-word}
.btns{display:flex;flex-direction:column;align-items:center;gap:8px}
.dot{width:30px;height:30px;padding:0;border-radius:50%;background:var(--ok);border:2px solid var(--ok);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.dot.none{background:transparent;border:2px dashed var(--mut);color:var(--mut)}
.keybox{flex:1;min-width:0;display:flex;align-items:stretch;background:var(--code);border:1px solid var(--soft);border-radius:8px}
.keybox:focus-within{outline:2px solid var(--ac);outline-offset:-1px}
.keybox input{border:0;background:transparent;border-radius:8px 0 0 8px;outline:0;flex:1;min-width:0}
.keybox .t{border-left:1px solid var(--soft);padding:4px 8px;font-size:11px;line-height:1.3;color:var(--mut);text-align:center;display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
.keybox .t b{color:var(--tx);font-weight:600}
.gh{margin-top:10px;font-size:13px;color:var(--mut)}.gh summary{cursor:pointer}.ghrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}.ghmsg{color:var(--tx)}
.lab{display:none}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:12px;max-width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;overflow:auto}
.box img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px;display:block;margin:0 auto}
.box .bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){
 .head{display:none}
 .row{grid-template-columns:1fr}
 .head div:not(:last-child),.cell:not(:last-child){border-right:0}
 .cell{flex-wrap:wrap}
 .lab{display:block;width:100%;font-size:12px;font-weight:700;color:var(--mut)}
 .cell:not(:last-child){border-bottom:1px dashed var(--soft)}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kho Script</h1>
  <p class="sub" id="sub"></p>
  <div id="tools"></div>
  <div class="search">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Tìm game… (gõ vài chữ đầu là ra)" autocomplete="off" enterkeyhint="search">
    <button class="qc" id="qc" type="button" title="Xóa tìm kiếm">✕</button>
  </div>
  <div class="found" id="found"></div>
  <div class="table">
    <div class="head"><div>Game</div><div>Script</div><div>Key</div></div>
    <div id="list"><div class="empty">Đang tải…</div></div>
  </div>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<script id="data" type="application/json">{"rev":0,"items":[]}</script>
<script>
(function(){
  var LS='kho-script-v1', GH='kho-script-gh';
  var admin=location.hash==='#admin';
  window.addEventListener('hashchange',function(){location.reload()});
  var listEl=document.getElementById('list'), tools=document.getElementById('tools'), sub=document.getElementById('sub');
  var modal=document.getElementById('modal'), box=document.getElementById('box');
  var qEl=document.getElementById('q'), qc=document.getElementById('qc'), found=document.getElementById('found');

  var embedded;
  try{ embedded=JSON.parse(document.getElementById('data').textContent); }catch(e){ embedded={rev:0,items:[]}; }
  var state=embedded, query='';
  function pick(c){ if(c&&Array.isArray(c.items)&&(c.rev||0)>=(state.rev||0)) state=c; }

  var warned=false;
  function save(){
    state.rev=Date.now();
    try{ localStorage.setItem(LS,JSON.stringify(state)); }
    catch(e){ if(!warned){ warned=true; alert('Bộ nhớ trình duyệt đã đầy (có thể do ảnh nhiều). Hãy bấm "Xuất data.json" ngay để không mất dữ liệu.'); } }
  }
  function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
  function fmt2(ms){
    if(!ms) return null;
    var d=new Date(ms), p=function(n){return String(n).padStart(2,'0')};
    return {t:p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()), d:p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()};
  }
  function el(tag,attrs,kids){
    var e=document.createElement(tag);
    for(var k in (attrs||{})){
      if(k==='text') e.textContent=attrs[k];
      else if(k==='class') e.className=attrs[k];
      else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),attrs[k]);
      else e.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){e.appendChild(c)});
    return e;
  }
  async function copyText(text,btn){
    var done=false;
    try{ await navigator.clipboard.writeText(text); done=true; }catch(e){}
    if(!done){
      try{
        var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
        done=document.execCommand('copy'); document.body.removeChild(ta);
      }catch(e){}
    }
    var old=btn.textContent;
    btn.textContent=done?'Đã copy ✓':'Lỗi';
    btn.classList.toggle('ok',done);
    setTimeout(function(){btn.textContent=old;btn.classList.remove('ok')},1400);
  }

  // ảnh: nén về tối đa 900px, JPEG
  function pickImage(cb){
    var f=el('input',{type:'file',accept:'image/*'});
    f.style.display='none';
    f.addEventListener('change',function(){
      var file=f.files&&f.files[0]; document.body.removeChild(f);
      if(!file) return;
      var r=new FileReader();
      r.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
          var c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
          var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
          cb(c.toDataURL('image/jpeg',0.75));
        };
        img.src=r.result;
      };
      r.readAsDataURL(file);
    });
    document.body.appendChild(f); f.click();
  }
  function closeModal(){ modal.classList.remove('on'); box.textContent=''; }
  modal.addEventListener('click',function(e){ if(e.target===modal) closeModal(); });
  function showImage(it){
    box.textContent='';
    box.appendChild(el('img',{src:it.img,alt:'Giao diện script'}));
    var bar=el('div',{class:'bar'});
    if(admin){
      bar.appendChild(el('button',{text:'Đổi ảnh',onclick:function(){ pickImage(function(d){ it.img=d; save(); render(); showImage(it); }); }}));
      bar.appendChild(el('button',{class:'ghost',text:'Xóa ảnh',onclick:function(){ delete it.img; save(); render(); closeModal(); }}));
    }
    bar.appendChild(el('button',{text:'Đóng',onclick:closeModal}));
    box.appendChild(bar);
    modal.classList.add('on');
  }

  // ===== dữ liệu: file data.json trên GitHub =====
  function exportFile(){
    if(!state.rev) state.rev=Date.now();
    var blob=new Blob([JSON.stringify(state)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  }
  function ghCfg(){
    var d={owner:'',repo:'',token:''};
    try{ Object.assign(d,JSON.parse(localStorage.getItem(GH)||'{}')); }catch(e){}
    if(!d.owner && /github\.io$/.test(location.hostname)){ d.owner=location.hostname.split('.')[0]; d.repo=location.pathname.split('/')[1]||''; }
    return d;
  }
  function toB64(str){
    var b=new TextEncoder().encode(str), bin='', n=0x8000;
    for(var i=0;i<b.length;i+=n) bin+=String.fromCharCode.apply(null,b.subarray(i,i+n));
    return btoa(bin);
  }
  async function publish(btn,msgEl){
    var cfg=ghCfg();
    if(!cfg.token||!cfg.owner||!cfg.repo){ msgEl.textContent='Chưa có token. Mở mục "Cài đặt đăng tự động" bên dưới để dán token.'; return; }
    btn.disabled=true; msgEl.textContent='Đang đăng…';
    try{
      var api='https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+'/contents/data.json';
      var h={Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'};
      var r=await fetch(api+'?ref=main',{headers:h,cache:'no-store'});
      var sha=null;
      if(r.ok){ sha=(await r.json()).sha; }
      else if(r.status!==404) throw new Error('Không đọc được repository ('+r.status+'). Kiểm tra lại token và tên repository.');
      if(!state.rev) state.rev=Date.now();
      var body={message:'Cập nhật dữ liệu từ trang quản trị',content:toB64(JSON.stringify(state)),branch:'main'};
      if(sha) body.sha=sha;
      var p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
      if(!p.ok){ var t={}; try{ t=await p.json(); }catch(e){} throw new Error(t.message||('Lỗi '+p.status)); }
      msgEl.textContent='✓ Đã đăng. Bạn bè tải lại trang là thấy bản mới (có thể chậm tối đa 1–2 phút).';
    }catch(e){ msgEl.textContent='Lỗi: '+(e.message||e); }
    btn.disabled=false;
  }
  async function loadRemote(){
    try{
      var r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
      if(r.ok){ var j=await r.json(); if(j&&Array.isArray(j.items)) return j; }
    }catch(e){}
    return null;
  }

  function renderTools(){
    tools.textContent='';
    if(!admin) return;
    var g=el('input',{placeholder:'Tên game',maxlength:'120'});
    var s=el('textarea',{placeholder:'Dán script mới vào đây…'});
    var b=el('button',{text:'+ Thêm',onclick:function(){
      if(!s.value.trim()) return;
      state.items.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),game:g.value.trim(),script:s.value,key:'',keyAt:0});
      g.value=''; s.value=''; save(); render();
    }});
    var cfg=ghCfg();
    var msg=el('span',{class:'ghmsg'});
    var pub=el('button',{text:'🚀 Đăng lên GitHub',onclick:function(){publish(pub,msg)}});
    var ex=el('button',{class:'ghost',text:'⬇ Xuất data.json (dự phòng)',onclick:exportFile});
    ex.style.color='var(--mut)';
    var ow=el('input',{placeholder:'Tài khoản GitHub'}); ow.value=cfg.owner||'';
    var rp=el('input',{placeholder:'Tên repository'}); rp.value=cfg.repo||'';
    var tk=el('input',{type:'password',placeholder:'Dán token GitHub (chỉ làm một lần)',autocomplete:'off'}); tk.value=cfg.token||'';
    var sv=el('button',{text:'Lưu cài đặt',onclick:function(){
      try{ localStorage.setItem(GH,JSON.stringify({owner:ow.value.trim(),repo:rp.value.trim(),token:tk.value.trim()})); msg.textContent='Đã lưu cài đặt.'; }
      catch(e){ msg.textContent='Không lưu được cài đặt.'; }
    }});
    var det=el('details',{class:'gh'},[el('summary',{text:'Cài đặt đăng tự động (token GitHub)'}),el('div',{class:'ghrow'},[ow,rp,tk,sv])]);
    tools.appendChild(el('div',{class:'add'},[g,s,b]));
    tools.appendChild(el('div',{class:'exp'},[pub,ex,msg]));
    tools.appendChild(det);
  }

  function fitG(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
  function fitAll(){ listEl.querySelectorAll('textarea.gin').forEach(fitG); }
  window.addEventListener('resize',fitAll);

  function matches(it){
    var words=query.split(' ').filter(Boolean);
    if(!words.length) return true;
    var n=norm(it.game);
    if(words.every(function(w){return n.indexOf(w)>-1})) return true;
    return n.replace(/\s+/g,'').indexOf(words.join(''))>-1;
  }

  function render(){
    listEl.textContent='';
    var all=state.items||[];
    var items=all.filter(matches);
    found.textContent=query.trim()?(items.length+' / '+all.length+' game'):'';
    if(!items.length){
      listEl.appendChild(el('div',{class:'empty',text:query.trim()?'Không tìm thấy game nào khớp.':(admin?'Chưa có script nào. Thêm script ở phía trên.':'Chưa có script nào.')}));
      return;
    }
    items.forEach(function(it){
      // cột Game
      var gEl;
      if(admin){
        gEl=el('textarea',{class:'gin',rows:'1',placeholder:'Tên game',maxlength:'120'}); gEl.value=it.game||'';
        gEl.addEventListener('input',function(){ fitG(gEl); });
        gEl.addEventListener('change',function(){ it.game=gEl.value.replace(/\s*\n\s*/g,' ').trim(); gEl.value=it.game; fitG(gEl); save(); });
        gEl.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); gEl.blur(); } });
      } else gEl=el('div',{class:'gname',text:it.game||'—'});
      var cg=el('div',{class:'cell'},[el('div',{class:'lab',text:'Game'}),gEl]);

      // cột Script
      var ta=el('textarea',{}); ta.value=it.script||''; if(!admin) ta.readOnly=true;
      if(admin) ta.addEventListener('change',function(){ it.script=ta.value; save(); });
      var copyBtn=el('button',{text:'Copy',onclick:function(){copyText(ta.value,copyBtn)}});
      var btns=[copyBtn];
      if(it.img){
        btns.push(el('button',{class:'dot',title:'Xem giao diện khi bật script',text:'▶',onclick:function(){showImage(it)}}));
      } else if(admin){
        btns.push(el('button',{class:'dot none',title:'Thêm ảnh giao diện',text:'+',onclick:function(){
          pickImage(function(d){ it.img=d; save(); render(); });
        }}));
      }
      if(admin) btns.push(el('button',{class:'ghost',text:'✕',title:'Xóa dòng',onclick:function(){
        if(confirm('Xóa dòng này?')){ var i=state.items.indexOf(it); if(i>-1) state.items.splice(i,1); save(); render(); }
      }}));
      var cs=el('div',{class:'cell'},[el('div',{class:'lab',text:'Script'}),ta,el('div',{class:'btns'},btns)]);

      // cột Key
      var keyIn=el('input',{placeholder:admin?'Nhập key…':'(chưa có key)',maxlength:'500'});
      keyIn.value=it.key||''; if(!admin) keyIn.readOnly=true;
      var tEl=el('div',{class:'t'});
      function showT(){
        tEl.textContent='';
        var f=fmt2(it.keyAt);
        if(f){ tEl.appendChild(el('b',{text:f.t})); tEl.appendChild(el('span',{text:f.d})); }
        else tEl.appendChild(el('span',{text:'time'}));
      }
      showT();
      if(admin){
        keyIn.addEventListener('change',function(){
          if(keyIn.value===(it.key||'')) return;
          it.key=keyIn.value; it.keyAt=Date.now(); save(); showT();
        });
        keyIn.addEventListener('keydown',function(e){ if(e.key==='Enter') keyIn.blur(); });
      }
      var keyCopy=el('button',{text:'Copy',onclick:function(){copyText(keyIn.value,keyCopy)}});
      var ck=el('div',{class:'cell'},[el('div',{class:'lab',text:'Key'}),el('div',{class:'keybox'},[keyIn,tEl]),keyCopy]);

      listEl.appendChild(el('div',{class:'row'},[cg,cs,ck]));
    });
    fitAll();
  }

  // tìm kiếm
  qEl.addEventListener('input',function(){
    query=norm(qEl.value).trim();
    qc.style.display=qEl.value?'block':'none';
    render();
  });
  qc.addEventListener('click',function(){ qEl.value=''; query=''; qc.style.display='none'; render(); qEl.focus(); });

  sub.textContent=admin?'Chế độ chủ trang: thêm, sửa, xóa. Dữ liệu lưu trong trình duyệt này, sửa xong nhớ bấm Đăng lên GitHub để bạn bè thấy.':'Gõ tên game vào ô tìm kiếm, bấm Copy để chép script hoặc key. Bấm nút xanh để xem giao diện.';
  renderTools();
  (async function(){
    var remote=await loadRemote();
    pick(remote);
    if(admin){
      try{ pick(JSON.parse(localStorage.getItem(LS)||'null')); }catch(e){}
    }
    render();
  })();
})();
</script>
</body>
</html>
